apiVersion: v1
kind: ConfigMap
metadata:
  name: shoplite-config
data:
  DB_HOST: postgres
  DB_NAME: {{ .Values.db.name | quote }}
  DB_USER: {{ .Values.db.user | quote }}
  REDIS_HOST: redis
  CHAOS_LATENCY_MS: {{ .Values.chaos.latencyMs | quote }}
  CHAOS_ERROR_RATE: {{ .Values.chaos.errorRate | quote }}
  CHAOS_MEMORY_LEAK: {{ .Values.chaos.memoryLeak | quote }}
  CHAOS_SLOW_DB: {{ .Values.chaos.slowDb | quote }}

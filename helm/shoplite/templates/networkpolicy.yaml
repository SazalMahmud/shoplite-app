apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-access
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres, redis]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [catalog-api, order-worker]

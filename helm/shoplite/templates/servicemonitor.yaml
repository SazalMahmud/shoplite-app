apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shoplite-api
spec:
  selector:
    matchLabels:
      app: catalog-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shoplite-worker
spec:
  selector:
    matchLabels:
      app: order-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: ap-southeast-1
  REGISTRY: 850995533893.dkr.ecr.ap-southeast-1.amazonaws.com/shoplite

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Unit tests
        run: cd services/catalog-api && npm ci && npm test
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/catalog-api/Dockerfile
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint helm/shoplite -f helm/shoplite/values-dev.yaml

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        svc: [web, catalog-api, order-worker]
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build
        run: docker build -t $REGISTRY/${{ matrix.svc }}:$TAG services/${{ matrix.svc }}
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.svc }}:${{ env.TAG }}
          severity: CRITICAL
          exit-code: "1"
      - name: AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login and push
        if: github.event_name == 'push'
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${REGISTRY%%/*}
          docker push $REGISTRY/${{ matrix.svc }}:$TAG

  update-gitops:
    if: github.event_name == 'push'
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Commit new tag to shoplite-gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          TAG=${GITHUB_SHA::7}
          git clone https://x-access-token:${GH_TOKEN}@github.com/SazalMahmud/shoplite-gitops.git
          cd shoplite-gitops
          sed -i "s/^imageTag:.*/imageTag: \"$TAG\"/" envs/dev/values.yaml
          git config user.email "ci@shoplite"
          git config user.name "ci"
          git commit -am "ci: bump imageTag to $TAG" && git push
